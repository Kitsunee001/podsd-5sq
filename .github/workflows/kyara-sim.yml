name: kyara-sim

on:
  schedule:
    # Every 6 hours (UTC). Minute 17 instead of :00 because the top of the
    # hour is when GitHub's scheduler is busiest and runs start late.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      test_now:
        description: "Test: send one open request right now, then stop"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Test runs get their own group so they don't wait behind the long loop.
  group: kyara-${{ inputs.test_now && 'test' || 'loop' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340       # safety net; GitHub hard-stops jobs at 360
    env:
      MAX_RUN_HOURS: "5.5"     # script exits cleanly after 5.5 h
      TEST_OPEN_NOW: ${{ inputs.test_now && '1' || '0' }}
      KYARA_TOKEN: ${{ secrets.KYARA_TOKEN }}
      KYARA_DEVICE_ID: ${{ secrets.KYARA_DEVICE_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 kyara_sim.py
